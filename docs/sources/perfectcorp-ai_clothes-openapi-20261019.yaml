    ## File Specs & Errors

    * Supported Formats & Dimensions


    |Type|Supported Dimensions|Supported File Size|Supported Formats|

    |  ---- | ---- | ---- | ---- |

    |Target user image|1024×768 recommended, 512×384 minimum, max side 4096
    px.</br></br> - Single person only.</br> - The person should occupy at least
    80% of the frame for optimal results.</br> - Images should include the upper
    body only, from the chest upwards. There is no need to show the abdomen, but
    the shoulders should be visible.</br> - The face must be fully visible, with
    no obstructions.</br> - The body must be facing forward in a standing
    position (no sitting or crouching). |< 10MB|jpg/png|

    |Reference image of the clothing |1024×768 recommended, 512×384 minimum, max
    side 4096 px.</br></br> - If Using a Real-Person Clothing Photo as
    Reference</br>&nbsp;&nbsp;&nbsp;- Must feature only one
    person.</br>&nbsp;&nbsp;&nbsp;- The visible clothing area must fully cover
    the intended try-on area.</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- Example:
    For full-body try-on, a half-body clothing image is not
    acceptable.</br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- Example: For
    lower-body try-on, partial pants are not acceptable.</br>&nbsp;&nbsp;&nbsp;-
    The clothing must not be heavily obstructed (e.g. covered by long hair or
    arms).</br>&nbsp;&nbsp;&nbsp;- The face must be fully visible, with no
    obstructions.</br>&nbsp;&nbsp;&nbsp;- The body must be facing forward in a
    standing position (no sitting or crouching). </br></br> - If Using a Product
    Image as Reference</br>&nbsp;&nbsp;&nbsp;- Must be a front-facing product
    shot of a single garment.</br>&nbsp;&nbsp;&nbsp;- Do not use composite
    images (e.g. top and bottom in one photo).</br>&nbsp;&nbsp;&nbsp;- For the
    lower body, only actual worn outfits are supported, not standalone product
    images.|< 10MB|jpg/png|


    * Error Codes


    * Error code (Preprocess)


    | Error code | Description |

    | ---------- | ----------- |

    | exceed_max_filesize | The SRC or REF image is too large. The long side
    must not exceed 4096 pixels. |

    | error_below_min_image_size | The SRC or REF image is too small. The long
    side must be at least 128 pixels. |

    | error_pose | The pose could not be detected from the uploaded human SRC
    image. |

    | error_invalid_ref | The REF image is invalid, for example, it is empty or
    the subject is not fully visible. |

    | error_apply_region_mismatch | The apply region in the SRC image does not
    match the REF image, so no edits can be applied. |

    | error_invalid_src | When the source image shows only the lower body or
    only the feet. |


    * Error code (Engine)


    | Error code | Description |

    | ---------- | ----------- |

    | invalid_parameter | - Invalid garment category. <br> - Style_id is not in
    inference_style_list. <br> - Invalid src_keys, dst_keys, or acts. <br> -
    Invalid ref_keys or template_ref_image. <br> - Exactly one of them must be
    provided. |

    | error_download_image | The SRC or REF image could not be downloaded. |

    | exceed_max_filesize | The SRC or REF image is too large. The file size
    must not exceed 10 MB. |

    | error_nsfw_content_detected | Potential NSFW content was detected in the
    result image. |

    | error_editing_failed | The editing process failed because the result image
    is too similar to the source image. |

    | unknown_internal_error | - Failed to load the model. <br> - Invalid
    scheduler algorithm type. <br> - No engine loaded. <br> - The file is not in
    the upload results. |

    | error_multi_person | The system detected multiple individuals in the
    source or reference image under a "normal" or "strict" multi-person filter
    setting. |



    * Environment & Dependency


    | Sample Code Language / Tool | Recommended Runtime Versions |

    |---|---|

    | cURL | - bash >= 3.2</br>   - curl >= 7.58 (modern TLS/HTTP
    support)</br>   - jq >= 1.6 (robust JSON parsing) |

    | Node.js (JavaScript) | Node >= 18 (for global fetch) |

    | JavaScript | - Chrome / Edge >= 80</br>   - Firefox >= 74</br>   - Safari
    >= 13.1 |

    | PHP | PHP >= 7.4 (for modern TLS/compat), ext-curl (recommended) or
    allow_url_fopen=On + ext-openssl, ext-json |

    | Python | Python >= 3.10 (for f-strings), requests >= 2.20.0 |

    | Java | Java 11+ (for HttpClient), Jackson Databind >= 2.12.0 |


    ---


    ## Unit Consumption


    | AI Feature | Unit Consumed |

    |---|---|

    | AI Clothes Virtual Try-On V2.0 | 2 |

    | AI Clothes Virtual Try-On V3.0 | 2 |


